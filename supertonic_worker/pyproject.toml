[project]
name = "mac-dictation-supertonic-tts-worker"
version = "0.1.0"
description = "On-demand Supertonic 3 worker for Mac Dictation Agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.139.0",
    "supertonic==1.3.1",
    "uvicorn==0.51.0",
]

[project.scripts]
supertonic-tts-worker = "supertonic_tts_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supertonic_tts_worker"]
