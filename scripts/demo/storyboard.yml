output: ../../assets/demo/raw/dictation-demo.webm
url: scene.html
viewport:
  width: 1280
  height: 720
cursor: false
scenes:
- name: Ready
  do:
  - pause: 1.0
- name: Listen
  do:
  - js: "setState('listening')"
  - pause: 2.0
- name: Transcribe locally
  do:
  - js: "setState('transcribing')"
  - pause: 0.65
- name: Paste at the cursor
  do:
  - js: "pasteTranscript()"
  - pause: 3.0
