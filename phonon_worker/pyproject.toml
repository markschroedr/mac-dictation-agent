[project]
name = "mac-dictation-phonon-tts-worker"
version = "0.1.0"
description = "On-demand Phonon 40M worker for Mac Dictation Agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ptts==0.4.1",
]

[project.scripts]
phonon-tts-worker = "phonon_tts_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phonon_tts_worker"]
